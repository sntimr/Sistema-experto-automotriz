<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Experto - Diagnóstico Automotriz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" >

        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Diagnóstico Automotriz Inteligente</h1>
        </header>

        <main>

            <section id="consulta" class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="h4 card-title mb-3">Seleccione los síntomas observados</h2>
                    <p class="text-muted small mb-4">Marque todas las casillas que describan el comportamiento actual de su vehículo.</p>
                    
                    <form id="form-diagnostico">
                        <!-- Contenedor dinámico de Sistemas y Checkboxes -->
                        <div id="contenedor-sintomas" class="accordion mb-4"> </div>

                        <!-- Panel de opciones seleccionadas -->
                        <div class="card shadow-sm mb-4 border-info">
                            <div class="card-header bg-info text-white fw-bold">
                                Síntomas seleccionados (<span id="contador-seleccionados">0</span>)
                            </div>
                            <div class="card-body bg-white">
                                <ul id="lista-seleccionados" class="mb-0 text-muted"></ul>
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex gap-3 mb-5">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1 shadow">Realizar Diagnóstico</button>
                            <button type="button" id="btn-limpiar" class="btn btn-outline-secondary btn-lg">Limpiar Selección</button>
                        </div>
                    </form>
                </div>
            </section>

            <section id="resultados" class="card shadow-sm mb-5" style="display: none;">
                <div class="card shadow-lg border-primary">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0 fs-5">Resultados del Diagnóstico</h3>
                    </div>
                    <div class="card-body">
                        
                        <div id="mensaje-excepcion" class="alert alert-warning" style="display: none;">
                            No se encontró un diagnóstico exacto único, evaluando ponderaciones...
                        </div>

                        <!-- Contenedor donde se inyectan las tarjetas de diagnóstico -->
                        <div id="lista-resultados"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script></body>
</html>
